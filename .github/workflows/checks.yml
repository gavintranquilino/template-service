name: checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: check/${{ matrix.check }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Keep this list in sync with CHECKS in tools/scripts/run_checks.py.
        check: [acronyms, links, whitespace]
    steps:
      - uses: actions/checkout@v4
      - name: Run ${{ matrix.check }} check
        run: python3 tools/scripts/run_checks.py ${{ matrix.check }}
